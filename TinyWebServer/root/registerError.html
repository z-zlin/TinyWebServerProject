<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册失败 - TinyWebServer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1 class="title">❌ 注册失败</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px; font-size: 16px;">
            请重新输入注册信息
        </p>
        
        <form action="3CGISQL.cgi" method="post">
            <div class="form-group">
                <input type="text" name="user" placeholder="请输入用户名" required="required">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="请设置密码" required="required">
            </div>
            <button type="submit" class="btn">
                🔄 重新注册
            </button>
        </form>
        
        <div class="error-message">
            ⚠️ 提示：该用户名已被注册，请选择其他用户名
        </div>
    </div>
</body>
</html>
