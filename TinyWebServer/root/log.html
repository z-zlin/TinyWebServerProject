<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - TinyWebServer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1 class="title">🔑 用户登录</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px; font-size: 16px;">
            请输入您的登录信息
        </p>
        
        <form action="2CGISQL.cgi" method="post">
            <div class="form-group">
                <input type="text" name="user" placeholder="请输入用户名" required="required">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="请输入登录密码" required="required">
            </div>
            <button type="submit" class="btn">
                🚀 立即登录
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 20px; color: #999; font-size: 14px;">
            <p>💡 提示：请确保用户名和密码正确</p>
        </div>
    </div>
</body>
</html>
