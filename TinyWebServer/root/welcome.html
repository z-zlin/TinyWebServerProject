<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容选择 - TinyWebServer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1 class="title">🎯 请做出你的选择！</h1>
        <p style="text-align: center; color: #666; margin-bottom: 40px; font-size: 16px;">
            请选择您想要查看的内容
        </p>
        
        <form action="5" method="post">
            <button type="submit" class="choice-btn">
                🖼️ 查看图片 (这里有一只芙芙哦)
            </button>
        </form>
        
        <form action="6" method="post">
            <button type="submit" class="choice-btn">
                🎬 观看视频 (罪人舞步旋.mp4)
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 30px; color: #999; font-size: 14px;">
            <p>💡 提示：点击上方按钮选择您感兴趣的内容</p>
        </div>
    </div>
</body>
</html>
